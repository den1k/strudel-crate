<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRUDEL/CRATE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="masthead">
    <h1>STRUDEL<span>/</span>CRATE</h1>
    <nav class="nav" aria-label="sections">
      <span class="sig">by Dennnis</span>
      <a href="/" class="on" aria-current="page">crate</a>
      <a href="/stems">stems</a>
      <button id="job-bell" class="job-bell" aria-label="notifications" title="generation log"><svg class="bell-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.6a3.4 3.4 0 0 0-3.4 3.4c0 3-1.5 4-1.5 4h9.8s-1.5-1-1.5-4A3.4 3.4 0 0 0 8 1.6Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.4 12a1.6 1.6 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span id="job-unread" class="job-unread" hidden>0</span></button>
    </nav>
    <div class="filters">
      <select id="batch-filter" aria-label="filter by batch"><option value="all">all batches</option></select>
      <div class="seg" role="group" aria-label="rating filter">
        <button data-filter="all" class="on">all</button>
        <button data-filter="unrated">unrated</button>
        <button data-filter="top">★4+</button>
      </div>
    </div>
  </header>
  <section class="generate" aria-label="generate">
    <span class="gen-label">gen</span>
    <input id="gen-prompt" type="text" placeholder="dark techno, rolling sub bass…" aria-label="prompt" />
    <span class="gen-x" aria-hidden="true">×</span>
    <input id="gen-count" type="number" min="1" max="30" value="12" aria-label="count" />
    <button id="gen-go">Run</button>
    <button id="gen-revise">Revise notes</button>
    <span id="gen-status" class="gen-status" role="status"></span>
  </section>
  <div id="job-log" class="job-log" hidden></div>
  <main id="tracks"><p class="empty">loading crate…</p></main>
  <footer id="transport">
    <span id="status" class="status">warming up samples…</span>
    <span id="now-playing"></span>
    <div id="seekbar" class="seekbar" hidden>
      <span id="elapsed" class="time">0:00</span>
      <div id="seek-rail" class="seek-rail" role="slider" aria-label="seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="seek-fill" class="seek-fill"></div>
      </div>
      <span id="total" class="time">0:00</span>
    </div>
    <button id="stop" disabled>■ STOP</button>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
