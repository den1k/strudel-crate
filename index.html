<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRUDEL/CRATE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="masthead">
    <h1>STRUDEL<span>/</span>CRATE</h1>
    <nav class="nav" aria-label="sections">
      <a href="/" class="on" aria-current="page">crate</a>
      <a href="/stems">stems</a>
      <button id="job-bell" class="job-bell" aria-label="notifications" title="generation log">🔔<span id="job-unread" class="job-unread" hidden>0</span></button>
    </nav>
    <div class="filters">
      <select id="batch-filter" aria-label="filter by batch"><option value="all">all batches</option></select>
      <div class="seg" role="group" aria-label="rating filter">
        <button data-filter="all" class="on">all</button>
        <button data-filter="unrated">unrated</button>
        <button data-filter="top">★4+</button>
      </div>
    </div>
  </header>
  <section class="generate" aria-label="generate">
    <input id="gen-prompt" type="text" placeholder="e.g. dark techno" aria-label="prompt" />
    <input id="gen-count" type="number" min="1" max="30" value="12" aria-label="count" />
    <button id="gen-go">Generate</button>
    <button id="gen-revise">Revise from notes</button>
    <span id="gen-status" class="gen-status" role="status"></span>
  </section>
  <div id="job-log" class="job-log" hidden></div>
  <main id="tracks"><p class="empty">loading crate…</p></main>
  <footer id="transport">
    <span id="status" class="status">warming up samples…</span>
    <span id="now-playing"></span>
    <button id="stop" disabled>■ STOP</button>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
